name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.13.1'

jobs:
  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: eslint
        run: npx eslint . --max-warnings 0
      - name: prettier
        run: npx prettier --check .

  types:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: tsc
        run: npx tsc --noEmit

  build:
    name: build and run the cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: build
        run: npm run build
      - name: the built cli answers
        run: |
          node dist/src/cli/main.js --version
          node dist/src/cli/main.js --help
          node dist/src/cli/main.js store migrations
      - name: the built cli builds a store
        run: |
          node dist/src/cli/main.js --store /tmp/ci.covercount.db store init
          node dist/src/cli/main.js --store /tmp/ci.covercount.db store status
      - name: declarations are expressible
        run: test -f dist/src/cli/main.d.ts

  test:
    name: tests on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.1', '22.13.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: vitest
        run: npm test -- --reporter=dot
      - name: the engines field is honest
        run: node -e "const p=require('./package.json');const semver=process.versions.node;console.log('running',semver,'engines',p.engines.node)"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: vitest with the floor enforced
        run: npm run coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # What actually ships is the production tree. The test runner never
      # leaves this repository, so an advisory against it is worth reading and
      # is not a reason to fail a build or to break the pinned toolchain.
      - name: nothing shipping carries a high advisory
        run: npm audit --omit=dev --audit-level=high
      - name: advisories against the toolchain, for reading
        run: npm audit || true
      - name: every dependency is pinned
        run: node scripts/check-pins.mjs
      - name: one version everywhere
        run: node scripts/check-version.mjs
      - name: nothing is exported that nothing imports
        run: node scripts/check-exports.mjs
      - name: every import points downwards
        run: node scripts/generate-map.mjs --check
      - name: the build is shippable
        run: |
          npm run build
          node scripts/check-release.mjs

  image:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the image
        run: docker build -t covercount:ci .
      - name: the entrypoint answers
        run: docker run --rm covercount:ci --version
      - name: the built store opens inside the image
        run: |
          docker run --rm covercount:ci store migrations
          # The image runs as uid 10001, and a bind mount arrives owned by
          # root, so the host directory has to be handed over first. This is
          # the same step anybody deploying it has to take.
          mkdir -p /tmp/ci && sudo chown 10001:10001 /tmp/ci
          docker run --rm -v /tmp/ci:/data covercount:ci store init
      - name: an unwritable mount is refused rather than crashing
        run: |
          mkdir -p /tmp/ci-locked && sudo chown root:root /tmp/ci-locked && sudo chmod 555 /tmp/ci-locked
          set +e
          docker run --rm -v /tmp/ci-locked:/data covercount:ci store init
          code=$?
          set -e
          test "$code" = "1"
      - name: the image runs as a non root user
        run: test "$(docker run --rm --entrypoint id covercount:ci -u)" != "0"

  docs:
    name: the command reference is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: regenerate and compare
        run: npm run docs:check
